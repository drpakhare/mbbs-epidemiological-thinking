<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Confounding Lab</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="widget.css">
<script src="theme.js"></script>
<style>
  svg .g1 { fill: var(--mark); } svg .g0 { fill: var(--mark2); opacity: 1; }
  svg .val { font: 600 15px var(--font-head); fill: var(--ink); }
  svg .cap { font-size: 13px; fill: var(--dim); }
</style>
</head>
<body>
<header class="band"><div>
  <p class="kicker"><a href="../index.html">Epidemiological thinking</a> · Lab 3</p>
  <h1>Confounding Lab</h1>
  <p>Look at the groups together, then split them by a third factor. Watch the comparison change.</p>
</div></header>
<main>
  <section class="panel">
    <div class="row"><span class="label">Example</span><div class="row" id="sets" role="group" aria-label="Example"></div></div>
    <div class="row"><span class="label">View</span><div class="seg" role="group" aria-label="View" id="views"></div></div>
  </section>

  <section class="stats" aria-live="polite" id="stats"></section>

  <section class="panel">
    <h2 id="ch"></h2>
    <svg id="bars" viewBox="0 0 640 260" style="width:100%;max-width:760px" role="img" aria-label="Outcome by group"></svg>
    <p class="note">Bar width shows how many people are in each group. Look at who ended up where.</p>
  </section>

  <section class="panel">
    <div class="scroll"><table id="tab"></table></div>
    <p class="claim" id="msg"></p>
  </section>
  <footer id="foot"></footer>
</main>
<script>
const SETS = {
  stones: { name: 'Kidney stones (real data)', g1: 'Open surgery (A)', g0: 'PCNL (B)', out: 'success', ttl: 'Success rate', rl: 'ratio of success rates', z: 'stone size', zl: ['Small stones', 'Large stones'],
    // [events, n] for g1 then g0, per stratum
    s: [[[81, 87], [234, 270]], [[192, 263], [55, 80]]],
    msg: 'Within each stone size, A does better. Overall, B looks better, because B was mostly given small stones, which do well whatever you do. Stone size is the confounder.',
    foot: 'Charig CR et al. BMJ 1986;292:879-82. Stratified as in Julious SA, Mullee MA. BMJ 1994;309:1480-1.' },
  coffee: { name: 'Coffee and lung cancer (illustrative)', g1: 'Coffee drinkers', g0: 'Non-drinkers', out: 'lung cancer', ttl: 'Risk of lung cancer', rl: 'risk ratio', z: 'smoking', zl: ['Smokers', 'Non-smokers'],
    s: [[[40, 400], [10, 100]], [[1, 100], [4, 400]]],
    msg: 'Overall, coffee drinkers seem to get almost three times as much lung cancer. Within smokers and within non-smokers, coffee makes no difference. Coffee drinkers were more often smokers. Smoking is the confounder.',
    foot: 'Illustrative figures, constructed for teaching. Built for teaching at AIIMS Bhopal.' }
};
const $ = id => document.getElementById(id);
let S, view = 'all';
const pc = (e, n) => (100 * e / n).toFixed(0) + '%';
function tot(i) { return S.s.reduce((t, st) => [t[0] + st[i][0], t[1] + st[i][1]], [0, 0]); }
function load(k) {
  S = SETS[k];
  document.querySelectorAll('#sets .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === k));
  $('views').innerHTML = `<button type="button" data-v="all">All together</button><button type="button" data-v="split">Split by ${S.z}</button>`;
  $('views').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { view = b.dataset.v; draw(); }));
  $('foot').textContent = S.foot; view = 'all'; draw();
}
function draw() {
  $('views').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === view));
  const T1 = tot(0), T0 = tot(1), crude = (T1[0] / T1[1]) / (T0[0] / T0[1]);
  // Mantel-Haenszel risk ratio across strata
  let num = 0, den = 0; S.s.forEach(([[a, n1], [c, n0]]) => { const N = n1 + n0; num += a * n0 / N; den += c * n1 / N; });
  const mh = num / den;
  const strat = S.s.map(([[a, n1], [c, n0]]) => (a / n1) / (c / n0));
  const stat = (n, l, c = '') => `<div class="stat ${c}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  $('stats').innerHTML = view === 'all'
    ? stat(crude.toFixed(2), `crude ${S.rl}, ${S.g1.toLowerCase()} vs ${S.g0.toLowerCase()}`, 'warn')
    : strat.map((r, i) => stat(r.toFixed(2), `${S.rl} in ${S.zl[i].toLowerCase()}`)).join('') + stat(mh.toFixed(2), `adjusted for ${S.z} (Mantel-Haenszel)`, 'good');
  // table
  let t = `<tr><th></th><th class="num">${S.g1}</th><th class="num">${S.g0}</th></tr>`;
  const row = (l, x, y, b) => `<tr${b ? ' class="sel"' : ''}><td>${l}</td><td class="num">${x[0]} / ${x[1]} = ${pc(...x)}</td><td class="num">${y[0]} / ${y[1]} = ${pc(...y)}</td></tr>`;
  if (view === 'split') S.s.forEach((st, i) => t += row(S.zl[i], st[0], st[1]));
  t += row('All together', T1, T0, view === 'all');
  $('tab').innerHTML = t;
  $('msg').textContent = view === 'all' ? `Now split by ${S.z}. Does the comparison hold?` : S.msg;
  $('msg').className = 'claim' + (view === 'all' ? '' : ' warn');
  // bars: groups side by side, width by n
  const groups = view === 'all' ? [['All together', T1, T0]] : S.s.map((st, i) => [S.zl[i], st[0], st[1]]);
  const maxN = Math.max(...groups.flatMap(g => [g[1][1], g[2][1]]));
  const maxR = Math.max(...groups.flatMap(g => [g[1][0] / g[1][1], g[2][0] / g[2][1]])) * 1.15;
  const H = 180, base = 210, slot = 600 / groups.length; let s = `<line class="axis" x1="20" y1="${base}" x2="620" y2="${base}"/>`;
  $('ch').textContent = view === 'all' ? `${S.ttl}, everyone together` : `${S.ttl}, by ${S.z}`;
  groups.forEach((g, gi) => {
    const x0 = 20 + gi * slot + 20;
    [[g[1], 'g1', S.g1], [g[2], 'g0', S.g0]].forEach(([d, cl, lab], j) => {
      const w = Math.max(8, (slot / 2 - 36) * Math.sqrt(d[1] / maxN)), r = d[0] / d[1], h = r / maxR * H;
      const x = x0 + j * (slot / 2 - 10);
      s += `<rect class="${cl}" x="${x}" y="${base - h}" width="${w}" height="${h}"/><text class="val" x="${x}" y="${base - h - 6}">${pc(...d)}</text>`;
      s += `<text class="cap" x="${x}" y="${base + 18}">${lab.split(' (')[0]}</text><text class="cap" x="${x}" y="${base + 34}">n = ${d[1]}</text>`;
    });
    s += `<text class="lb" x="${x0}" y="16">${g[0]}</text>`;
  });
  $('bars').innerHTML = s;
}
$('sets').innerHTML = Object.entries(SETS).map(([k, p]) => `<button type="button" class="chip" data-k="${k}">${p.name}</button>`).join('');
document.querySelectorAll('#sets .chip').forEach(b => b.addEventListener('click', () => load(b.dataset.k)));
load(new URLSearchParams(location.search).get('set') === 'coffee' ? 'coffee' : 'stones');
</script>
</body>
</html>
